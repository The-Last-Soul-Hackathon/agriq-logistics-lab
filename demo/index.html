
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AgriQ Logistics</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px;background:#f5f5f5}
    .card{background:#fff;padding:24px;border-radius:12px;margin:20px 0;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    button{padding:12px 18px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer}
    pre{background:#111;color:#0f0;padding:16px;border-radius:8px;white-space:pre-wrap;overflow:auto}
  </style>
</head>
<body>
  <h1>AgriQ Logistics</h1>

  <div class="card">
    <p><b>10,000 kg</b> · <b>3 Buyers</b> · <b>3 Vehicles</b></p>
    <button id="run">Run Recommendation</button>
  </div>

  <div class="card">
    <h2>Recommendation</h2>
    <div id="summary">Ready</div>
  </div>

  <div class="card">
    <h2>API Response</h2>
    <pre id="result">No result yet.</pre>
  </div>

  <script>
    document.getElementById("run").onclick = async () => {
      const data = {
        pickup_locations: [
          [28.6139,77.2090],
          [28.6500,77.1000],
          [28.7000,77.1500],
          [28.5500,77.0500],
          [28.5000,77.2000]
        ],
        demands: [0,2000,3000,1000,4000],
        vehicles: [
          {
            name: "Mini Truck",
            count: 2,
            capacity_kg: 5000,
            cost_per_km: 18,
            fixed_cost: 1000,
            loading_cost: 400,
            unloading_cost: 300,
            toll: 200,
            max_time_minutes: 180
          },
          {
            name: "Large Truck",
            count: 1,
            capacity_kg: 10000,
            cost_per_km: 25,
            fixed_cost: 1500,
            loading_cost: 700,
            unloading_cost: 500,
            toll: 300,
            max_time_minutes: 240
          }
        ],
        buyers: [
          {name:"Buyer A",lat:28.4500,lon:77.2500,price_per_kg:30},
          {name:"Buyer B",lat:28.3000,lon:77.1000,price_per_kg:28},
          {name:"Buyer C",lat:28.7000,lon:77.3000,price_per_kg:31}
        ]
      };

      const summary = document.getElementById("summary");
      const resultBox = document.getElementById("result");

      summary.textContent = "Calculating...";
      resultBox.textContent = "Calling AgriQ backend...";

      try {
        const response = await fetch(
          "https://urban-space-acorn-77vj977vxr6r3r4gw-8000.app.github.dev/recommend-time",
          {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(data)
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(JSON.stringify(result));
        }

        summary.innerHTML =
          "<h3>🏆 Recommended Buyer: " +
          result.recommended_buyer +
          "</h3><p><b>Net realization:</b> ₹" +
          result.recommended_net_per_kg +
          "/kg</p>";

        resultBox.textContent = JSON.stringify(result,null,2);

      } catch (error) {
        summary.textContent = "Request failed: " + error.message;
        resultBox.textContent = "Backend request failed.";
        console.error(error);
      }
    };
  </script>
</body>
</html>
